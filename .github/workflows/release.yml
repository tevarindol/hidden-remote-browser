name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: hidden-remote-browser-hidden-x86_64.exe
            goos: windows
            goarch: amd64
            ldflags: "-s -w -H=windowsgui"
          - name: hidden-remote-browser-x86_64.exe
            goos: windows
            goarch: amd64
            ldflags: "-s -w"
          - name: hidden-remote-browser-x86_64
            goos: linux
            goarch: amd64
            ldflags: "-s -w"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "${{ matrix.ldflags }}" -o ${{ matrix.name }} ./cmd/app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
