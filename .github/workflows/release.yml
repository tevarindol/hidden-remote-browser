name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Build wasm bindings
        run: wasm-pack build --target no-modules --no-typescript --release --out-dir extension/pkg

      - name: Validate manifest version
        run: jq --exit-status '.version | test("^[0-9]+(\\.[0-9]+){0,3}$")' extension/manifest.json >/dev/null

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: jq --exit-status --arg version "${GITHUB_REF_NAME#v}" '.version == $version' extension/manifest.json >/dev/null

      - name: Package extension
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          directory: extension
          path: .
          filename: ../hidden-remote-browser-extension.zip
          exclusions: '*.git*'

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: hidden-remote-browser-extension
          path: hidden-remote-browser-extension.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hidden-remote-browser-extension.zip
          generate_release_notes: true
