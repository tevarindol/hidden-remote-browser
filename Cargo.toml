[package]
name = "hidden-remote-browser"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/tevarindol/hidden-remote-browser"
license = "MIT OR Apache-2.0"
description = ""

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "FormData",
    "RequestInit",
    "Response",
] }

[profile.release]
opt-level = "z"
lto = true
